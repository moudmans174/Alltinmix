# One command to run everything:  docker compose up -d --build
# Configure by copying .env.example to .env first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alltinmix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: alltinmix
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alltinmix"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://alltinmix:${POSTGRES_PASSWORD}@db:5432/alltinmix
      TRUST_PROXY: "2"   # nginx in the frontend container + your HTTPS proxy in front of it
    volumes: [uploads:/data/uploads, private:/data/private]

  # Daily backups of the database and uploaded files into the "backups" volume (kept BACKUP_KEEP_DAYS days).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://alltinmix:${POSTGRES_PASSWORD}@db:5432/alltinmix
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
    command: ["sh", "/ops/backup-loop.sh"]
    volumes: [backups:/backups, uploads:/data/uploads:ro, private:/data/private:ro, ./ops:/ops:ro]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${WEB_PORT:-8080}:80"]

volumes:
  backups:
  pgdata:
  private:
  uploads:
