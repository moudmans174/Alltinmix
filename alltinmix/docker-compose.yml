# One command to run everything:  docker compose up -d --build
# Configure by copying .env.example to .env first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alltinmix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: alltinmix
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alltinmix"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://alltinmix:${POSTGRES_PASSWORD}@db:5432/alltinmix
      TRUST_PROXY: "2"   # nginx in the frontend container + your HTTPS proxy in front of it
    volumes: [uploads:/data/uploads, private:/data/private]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${WEB_PORT:-8080}:80"]

volumes:
  pgdata:
  private:
  uploads:
